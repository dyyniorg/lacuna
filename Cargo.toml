[package]
name = "lacuna"
description = "Semi-automated building geometry and address tag import utility for Finnish OSM"
repository = "https://github.com/dyyniorg/lacuna"
version = "0.2.2"
edition = "2024"

[dependencies]
geo = "0.29"
osmpbf = "0.3"
proj4rs = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls"] }
roxmltree = "0.20"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
